<!DOCTYPE html>
<html>
<head>
<title>Feira de Ciências e Tecnologia</title>
<style>
body {
    font-family: Arial;
    background-color: #0A1F44;
    color: white;
    margin: 0;
}

header {
    background-color: #123A7A;
    padding: 15px;
    text-align: center;
}

.menu {
    margin-top: 10px;
}

.menu a {
    color: #1E88E5;
    margin: 10px;
    text-decoration: none;
    font-weight: bold;
}

.container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
}

.card {
    background: #123A7A;
    padding: 20px;
    margin: 15px;
    border-radius: 10px;
    width: 250px;
    box-shadow: 0 0 10px #000;
    text-align: center;
}

.valor {
    font-size: 28px;
    color: #00E676;
}

.status {
    color: #FF5252;
}
</style>
</head>

<body>

<header>
    <h1>Feira de Ciências e Tecnologia</h1>
    <div class="menu">
        <a href="#">Início</a>
        <a href="#">Sensores</a>
        <a href="#">Robótica</a>
        <a href="#">Aplicações</a>
    </div>
</header>

<div class="container">

    <div class="card">
        <h2>📏 Distância</h2>
        <p class="valor">35 cm</p>
    </div>

    <div class="card">
        <h2>🌡️ Temperatura</h2>
        <p class="valor">26°C</p>
    </div>

    <div class="card">
        <h2>💧 Umidade</h2>
        <p class="valor">68%</p>
    </div>

    <div class="card">
        <h2>🤖 Robô</h2>
        <p>Velocidade: <span class="valor">0,8 m/s</span></p>
        <p class="status">Em movimento</p>
    </div>

    <div class="card">
        <h2>📺 OLED</h2>
        <p>Temp: 26°C</p>
        <p>Umid: 68%</p>
        <p>Dist: 35 cm</p>
    </div>

</div>

</body>
</html>

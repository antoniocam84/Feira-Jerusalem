<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Dashboard Inteligente - Sensores</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(135deg, #0f172a, #020617);
    color: white;
    text-align: center;
}

h1 {
    margin-top: 20px;
}

.container {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
}

.card {
    background: #1e293b;
    border-radius: 15px;
    padding: 20px;
    margin: 15px;
    width: 280px;
    box-shadow: 0 0 15px rgba(0,255,255,0.2);
    transition: 0.3s;
}

.card:hover {
    transform: scale(1.05);
}

.valor {
    font-size: 42px;
    margin: 10px 0;
}

.barra {
    width: 100%;
    height: 15px;
    background: #334155;
    border-radius: 10px;
    overflow: hidden;
}

.progresso {
    height: 100%;
    background: #22c55e;
    width: 50%;
    transition: 0.5s;
}

.info {
    font-size: 14px;
    margin-top: 10px;
    color: #cbd5f5;
}

button {
    margin-top: 20px;
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    background: #22c55e;
    color: white;
    cursor: pointer;
}
</style>
</head>

<body>

<h1>🌐 Dashboard Interativo de Sensores</h1>

<div class="container">

<div class="card">
<h2>📏 Distância</h2>
<div class="valor" id="distancia"></div>
<div class="barra"><div id="barraDist" class="progresso"></div></div>
<div class="info">Sensor ultrassônico mede distância usando ondas sonoras</div>
<div id="statusDist"></div>
</div>

<div class="card">
<h2>🌡️ Temperatura</h2>
<div class="valor" id="temp"></div>
<div class="barra"><div id="barraTemp" class="progresso"></div></div>
<div class="info">Sensor detecta variação térmica do ambiente</div>
<div id="statusTemp"></div>
</div>

<div class="card">
<h2>💧 Umidade</h2>
<div class="valor" id="umidade"></div>
<div class="barra"><div id="barraUmidade" class="progresso"></div></div>
<div class="info">Mede quantidade de vapor de água no ar</div>
<div id="statusUmidade"></div>
</div>

</div>

<button onclick="simularProximo()">🚨 Simular objeto próximo</button>

<canvas id="grafico" width="600" height="200"></canvas>

<script>
let historico = [];

function atualizarDados(simulado=false) {

    let distancia = simulado ? 10 : (Math.random()*100);
    let temp = 20 + Math.random()*15;
    let umidade = 40 + Math.random()*50;

    distancia = distancia.toFixed(1);
    temp = temp.toFixed(1);
    umidade = umidade.toFixed(1);

    document.getElementById("distancia").innerText = distancia + " cm";
    document.getElementById("temp").innerText = temp + " °C";
    document.getElementById("umidade").innerText = umidade + " %";

    document.getElementById("barraDist").style.width = distancia + "%";
    document.getElementById("barraTemp").style.width = (temp*2) + "%";
    document.getElementById("barraUmidade").style.width = umidade + "%";

    document.getElementById("statusDist").innerText =
        distancia < 20 ? "⚠️ Objeto muito próximo!" : "Distância segura";

    document.getElementById("statusTemp").innerText =
        temp < 25 ? "Frio" : temp < 30 ? "Ideal" : "Quente";

    document.getElementById("statusUmidade").innerText =
        umidade < 50 ? "Seco" : umidade < 70 ? "Confortável" : "Úmido";

    historico.push(distancia);
    if(historico.length > 20) historico.shift();

    desenharGrafico();
}

function desenharGrafico(){
    let canvas = document.getElementById("grafico");
    let ctx = canvas.getContext("2d");

    ctx.clearRect(0,0,600,200);

    ctx.beginPath();
    for(let i=0;i<historico.length;i++){
        let x = i*30;
        let y = 200 - historico[i]*2;
        if(i==0) ctx.moveTo(x,y);
        else ctx.lineTo(x,y);
    }
    ctx.stroke();
}

function simularProximo(){
    atualizarDados(true);
}

setInterval(atualizarDados,2000);
atualizarDados();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Dashboard Robótica e Sensores</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(135deg, #020617, #0f172a);
    color: white;
    text-align: center;
}

h1 {
    margin-top: 20px;
}

.container {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
}

.card {
    background: #1e293b;
    border-radius: 15px;
    padding: 20px;
    margin: 15px;
    width: 280px;
    box-shadow: 0 0 15px rgba(0,255,255,0.2);
}

.valor {
    font-size: 38px;
    margin: 10px;
}

.barra {
    width: 100%;
    height: 12px;
    background: #334155;
    border-radius: 10px;
}

.progresso {
    height: 100%;
    background: #22c55e;
    border-radius: 10px;
}

.oled {
    background: black;
    color: #00ffcc;
    font-family: monospace;
    padding: 15px;
    border-radius: 10px;
    text-align: left;
    margin-top: 10px;
}

button {
    padding: 10px;
    margin-top: 20px;
    border: none;
    background: #22c55e;
    color: white;
    border-radius: 8px;
    cursor: pointer;
}
</style>
</head>

<body>

<h1>🤖 Dashboard Inteligente - Robótica e Sensores</h1>

<div class="container">

<!-- DISTÂNCIA -->
<div class="card">
<h2>📏 Distância</h2>
<div id="distancia" class="valor"></div>
<div class="barra"><div id="barraDist" class="progresso"></div></div>
<div id="statusDist"></div>
</div>

<!-- TEMPERATURA -->
<div class="card">
<h2>🌡️ Temperatura</h2>
<div id="temp" class="valor"></div>
<div class="barra"><div id="barraTemp" class="progresso"></div></div>
<div id="statusTemp"></div>
</div>

<!-- UMIDADE -->
<div class="card">
<h2>💧 Umidade</h2>
<div id="umidade" class="valor"></div>
<div class="barra"><div id="barraUmidade" class="progresso"></div></div>
<div id="statusUmidade"></div>
</div>

<!-- ROBÔ -->
<div class="card">
<h2>🤖 Robô Seguidor</h2>
<div class="valor" id="velocidade"></div>
<div id="direcao"></div>
<div id="linha"></div>
</div>

<!-- OLED -->
<div class="card">
<h2>📺 Display OLED</h2>
<div class="oled" id="oled"></div>
</div>

</div>

<button onclick="simularErro()">🚨 Simular erro no robô</button>

<script>
function atualizar(){

    let dist = (Math.random()*100).toFixed(1);
    let temp = (20 + Math.random()*15).toFixed(1);
    let umi = (40 + Math.random()*50).toFixed(1);

    document.getElementById("distancia").innerText = dist + " cm";
    document.getElementById("temp").innerText = temp + " °C";
    document.getElementById("umidade").innerText = umi + " %";

    document.getElementById("barraDist").style.width = dist + "%";
    document.getElementById("barraTemp").style.width = (temp*2) + "%";
    document.getElementById("barraUmidade").style.width = umi + "%";

    document.getElementById("statusDist").innerText =
        dist < 20 ? "⚠️ Obstáculo próximo" : "Caminho livre";

    document.getElementById("statusTemp").innerText =
        temp < 25 ? "Frio" : temp < 30 ? "Ideal" : "Quente";

    document.getElementById("statusUmidade").innerText =
        umi < 50 ? "Seco" : umi < 70 ? "Confortável" : "Úmido";

    // ROBÔ
    let direcoes = ["➡️ Reto", "↩️ Esquerda", "↪️ Direita"];
    let dir = direcoes[Math.floor(Math.random()*3)];
    let vel = (Math.random()*100).toFixed(0);

    document.getElementById("velocidade").innerText = vel + "% potência";
    document.getElementById("direcao").innerText = "Direção: " + dir;
    document.getElementById("linha").innerText =
        dir === "➡️ Reto" ? "Linha central detectada" :
        "Ajustando trajetória";

    // OLED
    document.getElementById("oled").innerHTML =
        "DIST: " + dist + " cm<br>" +
        "TEMP: " + temp + " C<br>" +
        "UMI: " + umi + " %<br>" +
        "DIR: " + dir;
}

function simularErro(){
    document.getElementById("oled").innerHTML =
        "ERRO SENSOR!<br>Verificar conexao";
}

setInterval(atualizar,2000);
atualizar();
</script>

</body>
</html>

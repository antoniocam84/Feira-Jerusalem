<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Dashboard Inteligente - Robótica</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(135deg, #020617, #0f172a);
    color: white;
    text-align: center;
}

h1 {
    margin-top: 20px;
}

.container {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
}

.card {
    background: #1e293b;
    border-radius: 15px;
    padding: 20px;
    margin: 15px;
    width: 280px;
    box-shadow: 0 0 15px rgba(0,255,255,0.2);
    transition: 0.3s;
}

.card:hover {
    transform: scale(1.05);
}

.valor {
    font-size: 36px;
    margin: 10px 0;
}

.barra {
    width: 100%;
    height: 12px;
    background: #334155;
    border-radius: 10px;
}

.progresso {
    height: 100%;
    background: #22c55e;
    border-radius: 10px;
}

.oled {
    background: black;
    color: #00ffcc;
    padding: 10px;
    font-family: monospace;
    border-radius: 8px;
    margin-top: 10px;
    text-align: left;
}

button {
    margin-top: 20px;
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    background: #22c55e;
    color: white;
    cursor: pointer;
}
</style>
</head>

<body>

<h1>🤖 Dashboard de Robótica e Sensores</h1>

<div class="container">

<!-- DISTÂNCIA -->
<div class="card">
<h2>📏 Distância</h2>
<div class="valor" id="distancia"></div>
<div class="barra"><div id="barraDist" class="progresso"></div></div>
<div id="statusDist"></div>
</div>

<!-- TEMPERATURA -->
<div class="card">
<h2>🌡️ Temperatura</h2>
<div class="valor" id="temp"></div>
<div class="barra"><div id="barraTemp" class="progresso"></div></div>
<div id="statusTemp"></div>
</div>

<!-- UMIDADE -->
<div class="card">
<h2>💧 Umidade</h2>
<div class="valor" id="umidade"></div>
<div class="barra"><div id="barraUmidade" class="progresso"></div></div>
<div id="statusUmidade"></div>
</div>

<!-- ROBÔ -->
<div class="card">
<h2>🤖 Robô Seguidor de Linha</h2>
<div class="valor" id="estadoRobo"></div>
<div id="velocidade"></div>
<div class="barra"><div id="barraVel" class="progresso"></div></div>
<div id="sensoresLinha"></div>
</div>

<!-- OLED -->
<div class="card">
<h2>📟 Display OLED</h2>
<div class="oled" id="oled">
Iniciando...
</div>
</div>

</div>

<button onclick="simularObstaculo()">🚨 Simular obstáculo</button>

<script>
function atualizarDados(obstaculo=false){

    let distancia = obstaculo ? 10 : (Math.random()*100);
    let temp = 20 + Math.random()*15;
    let umidade = 40 + Math.random()*50;

    let velocidade = (Math.random()*100).toFixed(0);

    // Sensores de linha (0 = branco / 1 = preto)
    let s1 = Math.round(Math.random());
    let s2 = Math.round(Math.random());
    let s3 = Math.round(Math.random());

    // Estado do robô
    let estado = "Andando";
    if(obstaculo) estado = "Parado (obstáculo)";
    else if(s2==1) estado = "Seguindo linha";
    else if(s1==1) estado = "Virando esquerda";
    else if(s3==1) estado = "Virando direita";

    // Atualizar tela
    document.getElementById("distancia").innerText = distancia.toFixed(1)+" cm";
    document.getElementById("temp").innerText = temp.toFixed(1)+" °C";
    document.getElementById("umidade").innerText = umidade.toFixed(1)+" %";

    document.getElementById("barraDist").style.width = distancia+"%";
    document.getElementById("barraTemp").style.width = (temp*2)+"%";
    document.getElementById("barraUmidade").style.width = umidade+"%";

    document.getElementById("estadoRobo").innerText = estado;
    document.getElementById("velocidade").innerText = "Velocidade: "+velocidade+"%";
    document.getElementById("barraVel").style.width = velocidade+"%";

    document.getElementById("sensoresLinha").innerText =
        "Sensores: ["+s1+" "+s2+" "+s3+"]";

    // OLED
    document.getElementById("oled").innerText =
        "Dist: "+distancia.toFixed(1)+"cm\n"+
        "Temp: "+temp.toFixed(1)+"C\n"+
        "Umid: "+umidade.toFixed(1)+"%\n"+
        "Robo: "+estado;

    // Status
    document.getElementById("statusDist").innerText =
        distancia < 20 ? "⚠️ Objeto próximo!" : "Livre";

    document.getElementById("statusTemp").innerText =
        temp < 25 ? "Frio" : temp < 30 ? "Ideal" : "Quente";

    document.getElementById("statusUmidade").innerText =
        umidade < 50 ? "Seco" : umidade < 70 ? "OK" : "Úmido";
}

function simularObstaculo(){
    atualizarDados(true);
}

setInterval(atualizarDados,2000);
atualizarDados();
</script>

</body>
</html>
